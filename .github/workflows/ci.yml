name: CI

on:
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - "docs/**"

jobs:
  # 変更検出
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend-go: ${{ steps.filter.outputs.backend-go }}
      backend-python: ${{ steps.filter.outputs.backend-python }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend-go:
              - 'backend-go/**'
            backend-python:
              - 'backend-python/**'

  # Frontend CI
  frontend-ci:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build check
        run: npm run build

  # Backend Go CI
  backend-go-ci:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend-go == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: backend-go
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: backend-go/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v4
        continue-on-error: true
        with:
          version: latest
          working-directory: backend-go
          args: --timeout=5m

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Display coverage summary
        run: |
          echo "Test Coverage Summary"
          echo "====================="
          go tool cover -func=coverage.out | tail -1
          echo ""
          echo "Coverage by Domain Layer:"
          go tool cover -func=coverage.out | grep "internal/domain" || echo "No domain tests yet"

      - name: Post coverage comment to PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TOTAL_COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}')

          DOMAIN_ONLY_COVERAGE=$(go test -coverprofile=domain_coverage.out ./internal/domain/... 2>&1 | grep "coverage:" | tail -1 | awk '{print $5}')

          COMMENT_BODY=$(cat <<EOF
          ## Test Coverage Report

          ### Overall Coverage (全体)
          \`\`\`
          Total: ${TOTAL_COVERAGE}
          \`\`\`
          ※ backend-go全体（Handler, Infrastructure, Usecase, Domain層を含む）

          ### Domain Layer Coverage (Domain層のみ)
          \`\`\`
          Domain Layer: ${DOMAIN_ONLY_COVERAGE}
          \`\`\`
          ※ Domain層のみを母数としたカバレッジ

          ### Domain Layer Details (上位20関数)
          \`\`\`
          $(go tool cover -func=coverage.out | grep "internal/domain" | head -20 || echo "No domain tests")
          \`\`\`

          <details>
          <summary>View full coverage details</summary>

          \`\`\`
          $(go tool cover -func=coverage.out)
          \`\`\`

          </details>

          ---
          *Generated by CI at $(TZ='Asia/Tokyo' date '+%Y-%m-%d %H:%M:%S JST')*
          EOF
          )

          gh pr comment ${{ github.event.pull_request.number }} --body "$COMMENT_BODY"

      - name: Build check
        run: go build -v ./cmd/api

  # Backend Python CI
  backend-python-ci:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend-python == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-python
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend-python/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black
          pip install -r requirements.txt

      - name: Run ruff
        run: ruff check .

      - name: Run black (check only)
        run: black --check .

      - name: Type check with mypy (if available)
        run: |
          pip install mypy || echo "mypy not available, skipping"
          mypy app/ --ignore-missing-imports || echo "Type check skipped"
        continue-on-error: true
